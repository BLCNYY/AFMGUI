name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check server.mjs
          for f in public/js/*.js; do node --check "$f"; done
      - name: Server starts and serves the app
        run: |
          SPAWN_FM=0 HTTPS=0 node server.mjs &
          sleep 2
          curl -fsS http://127.0.0.1:1977/ | grep -q "AFM Chat"
